<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Games</title>
<meta name="description" content="A few small browser games. Plain HTML, no dependencies.">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>
<main class="page wide">
  <h1>Games</h1>
  <p class="lede">Small browser games.</p>

  <ul class="games">
    <li>
      <a href="/2048/">
        <span class="name">2048<span class="desc">Slide tiles to merge equal numbers.</span></span>
        <span class="note">Play</span>
      </a>
    </li>
    <li>
      <a href="/tic-tac-toe/">
        <span class="name">Tic-tac-toe<span class="desc">Three in a row against a perfect solver.</span></span>
        <span class="note">Play</span>
      </a>
    </li>
    <li>
      <a href="/ludo/">
        <span class="name">Ludo<span class="desc">Classic board race, four players.</span></span>
        <span class="note">Soon</span>
      </a>
    </li>
    <li>
      <a href="/chess/">
        <span class="name">Chess<span class="desc">Standard rules, keyboard-first board.</span></span>
        <span class="note">Soon</span>
      </a>
    </li>
  </ul>

  <p class="keys">Every game works with a keyboard and a screen reader.</p>
</main>

</html>
