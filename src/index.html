<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>2048</title>
<style>
  :root {
    --ink: #111;
    --paper: #fff;
    --line: #dcdcd8;
    --dim: #6b6b66;
    --fill: #f2f2ef;
    --slide: 110ms;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eaeae6; --paper: #101010; --line: #2e2e2c; --dim: #949490; --fill: #1a1a19; }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 1.5rem 1rem 2.5rem;
    background: var(--paper);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  main { width: min(88vw, 420px); }

  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .hint { margin: 0.25rem 0 1.25rem; font-size: 0.8125rem; color: var(--dim); }

  .scores {
    display: flex;
    gap: 1.75rem;
    margin-bottom: 0.75rem;
    align-items: baseline;
  }
  .score { display: flex; align-items: baseline; gap: 0.5rem; }
  .score .label {
    font-size: 0.6875rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .score .value { font-size: 1.125rem; font-variant-numeric: tabular-nums; }

  .board {
    --board: min(88vw, 420px);
    --gap: calc(var(--board) / 42);
    --cell: calc((var(--board) - 2px - 5 * var(--gap)) / 4);
    --step: calc(var(--cell) + var(--gap));
    position: relative;
    width: var(--board);
    height: var(--board);
    padding: var(--gap);
    border: 1px solid var(--line);
    background: var(--paper);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .board:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .cell, .tile {
    position: absolute;
    top: var(--gap);
    left: var(--gap);
    width: var(--cell);
    height: var(--cell);
    display: grid;
    place-items: center;
    transform: translate(calc(var(--c) * var(--step)), calc(var(--r) * var(--step)));
  }

  .cell { background: var(--fill); }

  .tile {
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-weight: 400;
    letter-spacing: -0.02em;
    z-index: 2;
    transition: transform var(--slide) cubic-bezier(0.3, 0, 0.2, 1);
  }
  .tile[data-len="1"], .tile[data-len="2"] { font-size: calc(var(--cell) * 0.4); }
  .tile[data-len="3"] { font-size: calc(var(--cell) * 0.32); }
  .tile[data-len="4"] { font-size: calc(var(--cell) * 0.25); }
  .tile[data-len="5"], .tile[data-len="6"] { font-size: calc(var(--cell) * 0.2); }

  .tile.big { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .tile.absorbed { z-index: 1; }
  .tile.appear { animation: appear 140ms cubic-bezier(0.3, 0, 0.2, 1); }
  .tile.pop { animation: pop 160ms cubic-bezier(0.3, 0, 0.2, 1); }

  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop {
    0%   { box-shadow: 0 0 0 0 var(--ink); }
    45%  { box-shadow: 0 0 0 3px var(--ink); }
    100% { box-shadow: 0 0 0 0 var(--ink); }
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 0.75rem;
    text-align: center;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    z-index: 5;
    opacity: 0;
    visibility: hidden;
    transition: opacity 200ms ease;
  }
  .overlay.shown { opacity: 1; visibility: visible; }
  .overlay p { margin: 0; font-size: 1.125rem; }
  .overlay small { display: block; color: var(--dim); font-size: 0.8125rem; }

  .controls { display: flex; gap: 0.5rem; margin-top: 0.875rem; }

  button {
    font: inherit;
    font-size: 0.875rem;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 0.5rem 0.9rem;
    min-height: 44px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button:disabled { color: var(--dim); cursor: default; border-color: var(--line); }

  .keys { margin: 1.25rem 0 0; font-size: 0.75rem; color: var(--dim); line-height: 1.7; }
  kbd {
    font: inherit;
    font-size: 0.6875rem;
    border: 1px solid var(--line);
    padding: 0.1rem 0.35rem;
    color: var(--ink);
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .tile.appear, .tile.pop { animation: none; }
    .overlay { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>2048</h1>

  <div class="scores">
    <div class="score"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="score"><span class="label">Best</span><span class="value" id="best">0</span></div>
  </div>

  <div class="board" id="board" tabindex="0" role="group" aria-label="Game board. Use arrow keys to slide tiles.">
    <div class="overlay" id="overlay" aria-hidden="true">
      <p id="overlay-text"></p>
      <small id="overlay-sub"></small>
    </div>
  </div>

  <div class="controls">
    <button type="button" id="new">New game</button>
    <button type="button" id="undo" disabled>Undo</button>
  </div>

  <p class="keys">
    <kbd>&larr;</kbd> <kbd>&darr;</kbd> <kbd>&uarr;</kbd> <kbd>&rarr;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &middot; swipe on touch &middot; <kbd>U</kbd> to undo &middot; <kbd>R</kbd> to restart
  </p>

  <div class="sr-only" aria-live="polite" id="live"></div>
  <div class="sr-only" id="readout"></div>
</main>

<script>
(() => {
  "use strict";

  const SIZE = 4;
  const SLIDE = 110;
  const INVERT_AT = 128;

  // ---------- engine (pure) ----------

  let nextId = 1;

  const grid = tiles => {
    const g = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    for (const t of tiles) g[t.r][t.c] = t;
    return g;
  };

  const LINES = {
    left:  Array.from({ length: SIZE }, (_, r) => Array.from({ length: SIZE }, (_, i) => [r, i])),
    right: Array.from({ length: SIZE }, (_, r) => Array.from({ length: SIZE }, (_, i) => [r, SIZE - 1 - i])),
    up:    Array.from({ length: SIZE }, (_, c) => Array.from({ length: SIZE }, (_, i) => [i, c])),
    down:  Array.from({ length: SIZE }, (_, c) => Array.from({ length: SIZE }, (_, i) => [SIZE - 1 - i, c]))
  };

  function spawn(tiles) {
    const g = grid(tiles);
    const free = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!g[r][c]) free.push([r, c]);
    if (!free.length) return null;
    const [r, c] = free[Math.floor(Math.random() * free.length)];
    return { id: nextId++, value: Math.random() < 0.9 ? 2 : 4, r, c };
  }

  function newGame() {
    const tiles = [];
    tiles.push(spawn(tiles));
    tiles.push(spawn(tiles));
    return { tiles, score: 0, reached: 0 };
  }

  // Returns { tiles, score, moved, absorbed, merged }
  // `absorbed` are tiles that slide under a survivor and then vanish.
  function slide(state, dir) {
    const g = grid(state.tiles);
    const tiles = [];
    const absorbed = [];
    const merged = [];
    let score = state.score;
    let moved = false;

    for (const line of LINES[dir]) {
      const seq = line.map(([r, c]) => g[r][c]).filter(Boolean);
      const slots = [];

      for (let i = 0; i < seq.length; i++) {
        if (i + 1 < seq.length && seq[i].value === seq[i + 1].value) {
          slots.push({ keep: seq[i], gone: seq[i + 1], value: seq[i].value * 2 });
          score += seq[i].value * 2;
          i++;
        } else {
          slots.push({ keep: seq[i], gone: null, value: seq[i].value });
        }
      }

      slots.forEach((slot, i) => {
        const [r, c] = line[i];
        if (slot.keep.r !== r || slot.keep.c !== c || slot.gone) moved = true;
        tiles.push({ id: slot.keep.id, value: slot.value, r, c });
        if (slot.gone) {
          absorbed.push({ id: slot.gone.id, r, c });
          merged.push(slot.keep.id);
        }
      });
    }

    const reached = Math.max(state.reached, ...tiles.map(t => t.value));
    return { tiles, score, reached, moved, absorbed, merged };
  }

  function stuck(tiles) {
    if (tiles.length < SIZE * SIZE) return false;
    const g = grid(tiles);
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const v = g[r][c].value;
        if (c + 1 < SIZE && g[r][c + 1].value === v) return false;
        if (r + 1 < SIZE && g[r + 1][c].value === v) return false;
      }
    return true;
  }

  // ---------- renderer ----------

  const board = document.getElementById("board");
  const overlay = document.getElementById("overlay");
  const overlayText = document.getElementById("overlay-text");
  const overlaySub = document.getElementById("overlay-sub");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const liveEl = document.getElementById("live");
  const readoutEl = document.getElementById("readout");
  const undoBtn = document.getElementById("undo");

  const nodes = new Map();
  let state = newGame();
  let history = [];
  let best = 0;
  let busy = false;
  let queued = null;
  let over = false;
  let celebrated = false;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.setProperty("--r", r);
      cell.style.setProperty("--c", c);
      board.appendChild(cell);
    }
  }

  function place(el, r, c) {
    el.style.setProperty("--r", r);
    el.style.setProperty("--c", c);
  }

  function paint(el, value) {
    el.textContent = value;
    el.dataset.len = String(value).length;
    el.classList.toggle("big", value >= INVERT_AT);
  }

  function makeTile(t) {
    const el = document.createElement("div");
    el.className = "tile";
    place(el, t.r, t.c);
    paint(el, t.value);
    board.appendChild(el);
    nodes.set(t.id, el);
    return el;
  }

  function rebuild() {
    for (const el of nodes.values()) el.remove();
    nodes.clear();
    for (const t of state.tiles) makeTile(t);
    sync();
  }

  function sync() {
    scoreEl.textContent = state.score;
    best = Math.max(best, state.score);
    bestEl.textContent = best;
    undoBtn.disabled = history.length === 0;

    const g = grid(state.tiles);
    readoutEl.textContent = "Board: " + g.map((row, r) =>
      "row " + (r + 1) + ", " +
      row.map(t => (t ? t.value : "empty")).join(", ")
    ).join(". ") + ".";
  }

  function announce(msg) {
    liveEl.textContent = "";
    setTimeout(() => { liveEl.textContent = msg; }, 60);
  }

  function showOverlay(text, sub) {
    overlayText.textContent = text;
    overlaySub.textContent = sub;
    overlay.classList.add("shown");
  }

  function hideOverlay() {
    overlay.classList.remove("shown");
  }

  // ---------- turn ----------

  function move(dir) {
    if (over) return;
    if (busy) { queued = dir; return; }

    const next = slide(state, dir);
    if (!next.moved) return;

    busy = true;
    history.push({ ...state, tiles: state.tiles.map(t => ({ ...t })) });
    if (history.length > 60) history.shift();

    const gained = next.score - state.score;

    // Phase 1 — everything slides, values unchanged.
    for (const t of next.tiles) place(nodes.get(t.id), t.r, t.c);
    for (const a of next.absorbed) {
      const el = nodes.get(a.id);
      el.classList.add("absorbed");
      place(el, a.r, a.c);
    }

    setTimeout(() => {
      // Phase 2 — absorbed tiles vanish, survivors take their new value.
      for (const a of next.absorbed) {
        nodes.get(a.id).remove();
        nodes.delete(a.id);
      }
      for (const t of next.tiles) {
        const el = nodes.get(t.id);
        if (Number(el.textContent) !== t.value) {
          paint(el, t.value);
          el.classList.remove("pop");
          void el.offsetWidth;
          el.classList.add("pop");
        }
      }

      state = { tiles: next.tiles, score: next.score, reached: next.reached };

      // Phase 3 — a new tile arrives.
      const fresh = spawn(state.tiles);
      if (fresh) {
        state.tiles.push(fresh);
        makeTile(fresh).classList.add("appear");
      }

      sync();

      if (gained) announce(gained + " points. Score " + state.score + ".");

      if (state.reached >= 2048 && !celebrated) {
        celebrated = true;
        showOverlay("2048.", "Keep going — press any key to dismiss.");
        announce("You reached 2048.");
      } else if (stuck(state.tiles)) {
        over = true;
        showOverlay("No moves left.", "Score " + state.score + ".");
        announce("Game over. Final score " + state.score + ".");
      }

      busy = false;
      if (queued) {
        const d = queued;
        queued = null;
        move(d);
      }
    }, SLIDE);
  }

  function restart() {
    state = newGame();
    history = [];
    over = false;
    celebrated = false;
    busy = false;
    queued = null;
    hideOverlay();
    rebuild();
    announce("New game.");
    board.focus();
  }

  function undo() {
    if (!history.length) return;
    state = history.pop();
    over = false;
    busy = false;
    queued = null;
    hideOverlay();
    rebuild();
    announce("Undone. Score " + state.score + ".");
  }

  // ---------- input ----------

  const KEYS = {
    ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
    a: "left", d: "right", w: "up", s: "down",
    h: "left", l: "right", k: "up", j: "down"
  };

  window.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (celebrated && overlay.classList.contains("shown") && !over) {
      hideOverlay();
    }

    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;

    if (key === "r") { e.preventDefault(); restart(); return; }
    if (key === "u") { e.preventDefault(); undo(); return; }

    const dir = KEYS[key];
    if (dir) { e.preventDefault(); move(dir); }
  });

  let start = null;

  board.addEventListener("pointerdown", e => {
    start = { x: e.clientX, y: e.clientY };
    board.setPointerCapture(e.pointerId);
  });

  board.addEventListener("pointerup", e => {
    if (!start) return;
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    start = null;

    if (celebrated && overlay.classList.contains("shown") && !over) hideOverlay();

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy)
      ? (dx > 0 ? "right" : "left")
      : (dy > 0 ? "down" : "up"));
  });

  board.addEventListener("pointercancel", () => { start = null; });
  board.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

  document.getElementById("new").addEventListener("click", restart);
  undoBtn.addEventListener("click", undo);

  rebuild();
})();
</script>
</body>
</html>
